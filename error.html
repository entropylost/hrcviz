<!DOCTYPE html>
<html lang="en">
	<head>
		<title>HRC Interpolation Error</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<h1>HRC Interpolation Error Visualizer</h1>
		<div>y-axis: position of probe, x-axis: distance between emitter and probe. Click on pixels on left to see cascade information, or click on right to see the falloff in 2D.</div>
		<canvas id="canvas" width="1792" height="768"></canvas>
		<div></div>
		<input type="checkbox" id="mode" name="mode">
		<label for="mode">Use half-integer probe positions</label>
		<input type="number" id="derivatives" name="derivatives" min="0" max="2" value="0">
		<label for="derivatives">Number of derivatives</label>
		<input type="text" id="scaling" name="scaling" value="1">
		<label for="scaling">Output scaling (1.12 is optimal for single derivative)</label>
		<select id="interpolate" name="interpolate">
			<option value="interpolate">Interpolate</option>
			<option value="near">Near</option>
			<option value="far">Far</option>
		</select>
		<label for="interpolate">Merging mode</label>
		<div></div>
		<canvas id="histogram" width="768" height="256"></canvas>
		<div></div>
		<input type="number" id="hist_min" name="hist_min" step="0.05" value="-0.5">
		<label for="hist_min">Histogram min</label>
		<input type="number" id="hist_max" name="hist_max" step="0.05" value="0.5">
		<label for="hist_max">Histogram max</label>
		<div id="output"></div>
		<script src="error.js"></script>
	</body>
</html>
